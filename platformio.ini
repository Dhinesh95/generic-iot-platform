; PlatformIO configuration for Generic IoT Platform
; Phase 1: Core Platform Skeleton + Home/Building Profile

[platformio]
default_envs = hub_home
src_dir = firmware

[env]
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
    -Werror
    -std=c11

; Unit test configuration — run on host, not on target
test_framework = unity
test_build_src = no

[env:hub_home]
platform = espressif32
board = esp32dev
build_flags =
    -DPROFILE_HOME
    -Wall
    -Wextra
    -Werror
lib_ldf_mode = deep+
build_src_filter =
    +<hub/>
    +<shared/>
    +<profiles/home/>

[env:hub_agriculture]
platform = espressif32
board = esp32dev
build_flags =
    -DPROFILE_AGRICULTURE
    -Wall
    -Wextra
    -Werror
lib_ldf_mode = deep+
build_src_filter =
    +<hub/>
    +<shared/>
    +<profiles/agriculture/>

[env:hub_hvac]
platform = espressif32
board = esp32dev
build_flags =
    -DPROFILE_HVAC
    -Wall
    -Wextra
    -Werror
lib_ldf_mode = deep+
build_src_filter =
    +<hub/>
    +<shared/>
    +<profiles/hvac/>

[env:hub_water_treatment]
platform = espressif32
board = esp32dev
build_flags =
    -DPROFILE_WATER_TREATMENT
    -Wall
    -Wextra
    -Werror
lib_ldf_mode = deep+
build_src_filter =
    +<hub/>
    +<shared/>
    +<profiles/water_treatment/>

; Unit tests (run on host with native toolchain)
[env:unit_tests]
platform = native
build_flags =
    -Wall
    -Wextra
    -std=c11
build_src_filter =
    +<shared/>
    +<hub/>
    +<profiles/home/>
test_build_src = yes
test_filter = test_*
